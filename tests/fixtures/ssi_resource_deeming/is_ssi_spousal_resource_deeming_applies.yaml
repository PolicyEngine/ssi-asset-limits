# Copied from PolicyEngine/policyengine-us#10040 (branch ssi-resource-deeming,
# commit 190f45824e), policyengine_us/tests/policy/baseline/gov/ssa/ssi/eligibility/resources/deemed/is_ssi_spousal_resource_deeming_applies.yaml, without the cases that need parent
# links, which policyengine-us 2.2.1 lacks. Expected values are the
# branch's, sourced from 20 CFR 416.1160-416.1205 and POMS SI 01330.
- name: ABD claimant with an ineligible spouse applies resource deeming without income
  period: 2026-01
  input:
    people:
      claimant:
        age: 40
        is_ssi_aged_blind_disabled: true
        is_tax_unit_head: true
        ssi_countable_resources:
          '2026': 0
      spouse:
        age: 40
        is_ssi_aged_blind_disabled: false
        is_tax_unit_spouse: true
        ssi_countable_resources:
          '2026': 0
    tax_units:
      family:
        members:
        - claimant
        - spouse
    marital_units:
      family_couple_0:
        members:
        - claimant
        - spouse
    households:
      family:
        members:
        - claimant
        - spouse
  output:
    is_ssi_spousal_resource_deeming_applies:
    - true
    - false
