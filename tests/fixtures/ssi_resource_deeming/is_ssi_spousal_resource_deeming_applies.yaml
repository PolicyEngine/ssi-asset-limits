- name: Omitted marital units do not make a tax head parent an adult dependent spouse
  period: 2026-01
  input:
    people:
      parent:
        age: 40
        is_ssi_aged_blind_disabled: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        is_tax_unit_dependent: false
        is_household_head: false
        ssi_countable_resources:
          '2026': 5000
        is_parent: true
      adult_child:
        age: 25
        is_ssi_aged_blind_disabled: true
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        is_household_head: false
        ssi_countable_resources:
          '2026': 0
    tax_units:
      family:
        members:
        - parent
        - adult_child
    households:
      home:
        members:
        - parent
        - adult_child
  output:
    is_ssi_spousal_resource_deeming_applies:
    - false
    - false
    ssi_resources_deemed_from_ineligible_spouse:
    - 0
    - 0
    meets_ssi_resource_test:
    - false
    - true
- name: Married dependents in a parent's tax unit deem the ineligible spouse's resources
  period: 2026-01
  input:
    people:
      mother:
        age: 55
        is_ssi_aged_blind_disabled: false
        is_tax_unit_head: true
        is_tax_unit_spouse: false
        ssi_countable_resources:
          '2026': 0
      claimant:
        age: 25
        is_ssi_aged_blind_disabled: true
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        ssi_countable_resources:
          '2026': 0
      spouse:
        age: 25
        is_ssi_aged_blind_disabled: false
        is_tax_unit_head: false
        is_tax_unit_spouse: false
        is_tax_unit_dependent: true
        ssi_countable_resources:
          '2026': 3001
    tax_units:
      family:
        members:
        - mother
        - claimant
        - spouse
    marital_units:
      mother_unit:
        members:
        - mother
      couple:
        members:
        - claimant
        - spouse
    households:
      home:
        members:
        - mother
        - claimant
        - spouse
  output:
    is_ssi_spousal_resource_deeming_applies:
    - false
    - true
    - false
    ssi_resources_deemed_from_ineligible_spouse:
    - 0
    - 3001
    - 0
    meets_ssi_resource_test:
    - true
    - false
    - false
